<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spin Wheel">
<meta name="application-name" content="Spin Wheel">
<meta name="theme-color" content="#1b1250">
<meta name="format-detection" content="telephone=no">
<title>Spin the Wheel</title>
<link rel="apple-touch-icon" href="%%ICON%%">
<link rel="icon" type="image/png" href="%%ICON%%">
<link rel="manifest" href="%%MANIFEST%%">
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--ink:#2b2250;--gold:#ffc83d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation;margin:0;padding:0}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#1b1250}
body{font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font:inherit;user-select:text;-webkit-user-select:text;touch-action:auto}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse 70% 40% at 20% 8%,rgba(255,90,200,.35),transparent 70%),radial-gradient(ellipse 60% 35% at 90% 85%,rgba(60,170,255,.35),transparent 70%),linear-gradient(#1b1250,#2a1a7a)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:calc(var(--sat) + 6px) calc(var(--sar) + 10px) calc(var(--sab) + 10px) calc(var(--sal) + 10px);max-width:640px;margin:0 auto;gap:8px}
.screen.on{display:flex}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;min-width:52px;border-radius:18px;background:#fff;font-size:21px;font-weight:900;box-shadow:0 5px 0 #4a34a8;padding:0 14px;transition:transform .08s;flex:none}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4a34a8}
.btn.gold{background:var(--gold)}.btn.green{background:#7fe08a}.btn.pink{background:#ff9ad1}.btn.blue{background:#7fd0ff}.btn.red{background:#ff7b8a}
.btn:disabled{opacity:.4}
.topbar{display:flex;align-items:center;gap:8px;min-height:56px;flex:none}
.topbar .grow{flex:1;min-width:0;text-align:center;font-size:24px;font-weight:900;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl{color:#fff;font-weight:900;font-size:18px}
/* play */
#wheelBox{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#wheelWrap{position:relative;touch-action:none}
#wheel{display:block;border-radius:50%;box-shadow:0 8px 0 #120c3a,0 0 0 6px #fff,0 0 0 11px var(--gold);touch-action:none}
#pointer{position:absolute;left:50%;top:-16px;width:44px;height:54px;margin-left:-22px;transform-origin:50% 10px;z-index:2;filter:drop-shadow(0 3px 0 #120c3a)}
#hub{position:absolute;left:50%;top:50%;width:18%;height:18%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd75e 45%,#e8a400);box-shadow:0 3px 0 #8a5d00;z-index:1}
#spinBtn{min-height:76px;font-size:36px;border-radius:26px;letter-spacing:2px}
.row{display:flex;gap:8px;flex:none}.row>.btn{flex:1}
/* edit */
#editName,#slotText{width:100%;min-height:52px;border-radius:16px;border:4px solid #c4b2ff;padding:0 14px;font-size:22px;font-weight:800;color:var(--ink);background:#fff;outline:none}
.countRow{display:flex;align-items:center;gap:8px;flex:none}
#count{flex:1;text-align:center;font-size:40px;font-weight:900;color:#fff}
.presets{display:flex;gap:6px;flex:none;flex-wrap:wrap}.presets .btn{flex:1;min-width:52px;padding:0 6px;font-size:19px}
#slotList{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:4px 2px 8px;align-content:start;border-radius:14px}
.slot{display:flex;align-items:center;gap:8px;min-height:52px;border-radius:14px;padding:0 10px;font-size:19px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.35);text-align:left;overflow:hidden}
.slot .n{opacity:.7;font-size:14px;flex:none}.slot .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* overlays */
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,6,40,.7);z-index:10;padding:calc(var(--sat) + 10px) 12px calc(var(--sab) + 10px)}
.ov.on{display:flex}
.card{background:#fff;border-radius:26px;padding:16px;width:100%;max-width:460px;max-height:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 0 #4a34a8;overflow:hidden}
.card h2{font-size:26px;text-align:center}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sw button{aspect-ratio:1;min-height:44px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.sw button.sel{outline:4px solid var(--ink);outline-offset:2px}
.emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:4px;max-height:150px;overflow-y:auto;touch-action:pan-y}
.emo button{min-height:44px;font-size:26px;border-radius:10px;background:#f1edff}
.emo button.sel{background:var(--gold)}
#winCard{align-items:center;text-align:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
#winBadge{width:100%;border-radius:22px;padding:22px 10px;font-size:44px;font-weight:900;word-break:break-word;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
#winBadge .e{display:block;font-size:64px}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:11}
#wheelList{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:10px;padding:4px 2px 8px}
.wrow{display:flex;gap:6px;align-items:center;background:rgba(255,255,255,.12);border-radius:18px;padding:6px}
.wrow.cur{background:rgba(255,200,61,.35)}
.wrow .mini{width:52px;height:52px;flex:none;border-radius:50%}
.wrow .nm{flex:1;min-width:0;color:#fff;font-size:20px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;min-height:52px}
.wrow .btn{padding:0 8px;font-size:20px}
#picked{display:none;gap:6px;overflow-x:auto;flex:none;touch-action:pan-x;padding:2px 0}
#picked.on{display:flex}
#picked .pk{flex:none;display:flex;align-items:center;gap:4px;min-height:36px;border-radius:12px;padding:0 10px;font-size:16px;font-weight:900;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.35)}
#remBtn.on{background:#7fe08a}
#remBtn{white-space:nowrap;font-size:19px;padding:0 8px}
#play .row .btn{white-space:nowrap;padding:0 8px}
#board .lbl{text-align:center;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.stats{display:flex;gap:8px;flex:none}.stats>div{flex:1;min-width:0;background:rgba(255,255,255,.14);border-radius:16px;padding:6px;color:#fff;text-align:center;font-weight:800;font-size:15px;overflow:hidden}
.stats b{display:block;font-size:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#boardList{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:8px;padding:2px 2px 8px}
.lb{display:flex;align-items:center;gap:8px;min-height:56px;background:#fff;border-radius:16px;padding:6px 10px;box-shadow:0 4px 0 #4a34a8;flex:none}
.lb.retired{opacity:.5;filter:grayscale(1)}
.lb .rk{width:40px;flex:none;text-align:center;font-size:26px;font-weight:900}
.lb .chip{flex:none;min-width:44px;max-width:40%;height:40px;border-radius:12px;padding:0 8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .bar{flex:1;min-width:20px;height:14px;background:#eee;border-radius:7px;overflow:hidden}.lb .bar i{display:block;height:100%;border-radius:7px}
.lb .w{flex:none;font-size:22px;font-weight:900;min-width:34px;text-align:right}.lb .c{flex:none;font-size:15px;font-weight:900}
.empty{color:#fff;text-align:center;font-size:22px;font-weight:800;padding:30px 10px}
</style>
</head>
